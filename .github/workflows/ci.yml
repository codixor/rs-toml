name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned nightly for Miri and cargo-fuzz; bump deliberately.
  NIGHTLY: nightly-2026-11-13
  RUSTFLAGS: -D warnings

jobs:
  check:
    # GitHub-hosted runner; this public repo must not use self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo fmt --all -- --check
      - run: bash scripts/check-unsafe.sh
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --no-default-features --locked
      - run: cargo check --workspace --benches --locked

  miri:
    # Undefined-behaviour check for the arena, MaybeUninit and layout code.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly with Miri
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$NIGHTLY" miri setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          key: miri
      - name: Miri (strict provenance)
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
          RUSTFLAGS: ""
        run: cargo "+$NIGHTLY" miri test --workspace --all-features --locked --lib --tests

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
