# Read by GitHub Actions. Runs the cargo-fuzz targets in fuzz/ on a
# GitHub-hosted runner (this public repo must not use self-hosted runners).
# No secrets are used.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned nightly for Miri and cargo-fuzz; bump deliberately.
  NIGHTLY: nightly-2026-11-13
  CARGO_FUZZ_VERSION: "0.13.2"
  # 60 s per target on pull requests, ~5 min on schedule / manual runs.
  FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '300' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [parse, diff_toml, vault_server_config, vault_import_config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo "+$NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          cargo "+$NIGHTLY" fuzz run "$TARGET" "$RUNNER_TEMP/corpus" "corpus/$TARGET" \
            -- -max_total_time="$FUZZ_SECONDS"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
