name: Conformance

# Runs the official toml-lang/toml-test suite (pinned in scripts/toml-test.sh)
# against rs-toml via diver/toml-test-harness, for TOML 1.1 and 1.0.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  toml-test:
    # GitHub-hosted runner; this public repo must not use self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: diver/toml-test-harness -> ../../target/toml-test-harness
      - name: Run toml-test
        run: bash scripts/toml-test.sh
