name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  conformance:
    uses: ./.github/workflows/conformance.yml

  plan:
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      required: ${{ steps.release.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py

  publish:
    needs: [checks, conformance, plan]
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.deleted && needs.plan.outputs.required == 'true'
    environment: cratesio
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: cratesio-rs-toml-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Recheck after the environment wait and any other publisher for this version.
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py
      - name: Verify the pushed tag still points to this commit
        if: steps.release.outputs.required == 'true'
        shell: bash
        run: |
          git fetch --no-tags origin "$GITHUB_REF"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
      - name: Publish derive macros
        if: steps.release.outputs.publish_macros == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --registry crates-io -p rs-toml-macros
      - name: Publish the parser
        if: steps.release.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --registry crates-io -p rs-toml
      - name: Create the GitHub release
        if: steps.release.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          flags=()
          if [[ "${VERSION%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" --verify-tag --title "rs-toml $VERSION" \
            --notes "[rs-toml $VERSION on crates.io](https://crates.io/crates/rs-toml/$VERSION)" \
            --generate-notes "${flags[@]}"
