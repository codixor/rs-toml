[package]
name = "rs-toml-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Standalone workspace: not a member of the root rs-toml workspace.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4.13"
rs-toml = { path = "..", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff_toml"
path = "fuzz_targets/diff_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_server_config"
path = "fuzz_targets/vault_server_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_import_config"
path = "fuzz_targets/vault_import_config.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
