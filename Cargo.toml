[workspace]
members = [".", "macros"]
# Upstream toml-spanner tooling (benchmarks, toml-test harness); built separately.
exclude = ["diver"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codixor/rs-toml"
version = "0.4.0"

[workspace.dependencies]
foldhash = "0.2.0"
serde = { version = "1.0.229", default-features = false }
thiserror = "2.0.21"
zmij = "1.0.23"
anstream = "1.0.0"
anstyle-svg = "1.1.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "html_reports", "plotters"] }
oorandom = "11.1.5"
pretty_assertions = "1.4.1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[package]
name = "rs-toml"
version.workspace = true
description = "Pure Rust TOML parser and emitter with span-preserving document access."
edition.workspace = true
license.workspace = true
readme = "README.md"
categories = ["parser-implementations", "config"]
rust-version.workspace = true
repository.workspace = true
include = ["src/**", "benches/**", "examples/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
all = "warn"
pedantic = "warn"

[features]
default = []
derive = ["dep:rs-toml-macros"]
serde = ["dep:serde"]

[lib]
name = "rs_toml"
path = "src/lib.rs"

[dependencies]
rs-format = "0.1.0"
foldhash.workspace = true
serde = { workspace = true, features = ["std"], optional = true }
thiserror.workspace = true
rs-toml-macros = { package = "rs-toml-macros", version = "0.4.0", path = "macros", optional = true }
zmij.workspace = true

[dev-dependencies]
anstream.workspace = true
anstyle-svg.workspace = true
criterion.workspace = true
oorandom.workspace = true
pretty_assertions.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
toml = "1.2.1"

[[example]]
name = "derive"
required-features = ["derive"]

[[bench]]
name = "toml_core"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
